services:

  # Vite/Vue-based frontend for SAGE Integration
  frontend:
    build: ./Frontend
    image: opaca-llm-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL:
      VITE_METHOD:
      VITE_BACKLINK:
      VITE_PLATFORM_URL:
      VITE_AUTOCONNECT:
      VITE_ALLOW_CONTAINER_MANAGEMENT:
      VITE_COLOR_SCHEME:
      VITE_LANGUAGE:
      VITE_AUTH_ENABLED:
      VITE_AUTH_DOMAIN:
      VITE_AUTH_CLIENT_ID:
      VITE_AUTH_AUDIENCE:

  # FastAPI-based backend for SAGE Integration
  backend:
    build: ./Backend
    image: opaca-llm-backend
    ports:
      - "3001:3001"
    depends_on:
      - session-db
      - vector-db
    environment:
      TZ: Europe/Berlin
      OPENAI_API_KEY:
      ANTHROPIC_API_KEY:
      MISTRAL_API_KEY:
      GEMINI_API_KEY:
      LLM_HOSTS:
      LLM_API_KEYS:
      LLM_MODELS:
      CORS_WHITELIST:
      MONGODB_URI: "mongodb://user:pass@session-db:27017"
      QDRANT_URL: "http://vector-db:6333"
      # Document search over uploaded files. Unset variables fall back to the
      # defaults in Backend/src/rag/service.py; see docs/rag_design.md for what
      # each one changes and why it defaults the way it does.
      ENABLE_RAG:
      EMBEDDING_MODEL:
      RAG_MIN_INDEX_CHARS:
      RAG_CONTEXT_BUDGET:
      RAG_CHUNK_SIZE:
      RAG_CHUNK_OVERLAP:
      RAG_MIN_DENSE_SCORE:
      ENABLE_HYBRID_SEARCH:
      ENABLE_RERANKING:
      SESSION_ADMIN_PWD:
      LOCATION:
      VITE_AUTH_DOMAIN:
      VITE_AUTH_AUDIENCE:
    volumes:
      - appdata:/app/data

  # MongoDB for storing session data
  session-db:
    image: mongo:8.0.14
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: pass
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb

  # Qdrant for document embeddings, one collection per session.
  # Not exposed outside the compose network: it holds document text, and
  # nothing outside the backend has any reason to reach it.
  vector-db:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  # Optional OPACA platform service
  platform:
    image: ghcr.io/gt-arc/opaca/opaca-platform:main
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      PUBLIC_URL:
      PLATFORM_ENVIRONMENT: DOCKER
      ENABLE_AUTH: false
      DB_EMBED: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - platform


# Create a volume to persistently store data
volumes:
  mongodata:
    driver: local
  mongoconfig:
    driver: local
  appdata:
    driver: local
  qdrantdata:
    driver: local